<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Asim &amp; Sana — Wedding Invitation</title>
    <meta name="description" content="With their families, Asim Abdul Ghafoor and Sana Abdul Khaliq invite you to celebrate their Baraat and Walima in November 2026." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Asim &amp; Sana — Wedding Invitation" />
    <meta property="og:description" content="Join Asim and Sana for their Baraat on 20 November and Walima on 21 November 2026." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Asim &amp; Sana — Wedding Invitation" />
    <meta name="twitter:description" content="Join Asim and Sana for their Baraat on 20 November and Walima on 21 November 2026." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preconnect so TCP+TLS handshakes happen early -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Non-blocking font loading (print→stylesheet swap trick):
      - rel="preload" fires a high-priority, non-render-blocking fetch.
      - onload flips rel to "stylesheet" so fonts apply once the CSS arrives.
      - All 5 families and weights are preserved (Amiri for Urdu, others for English).
      - display=swap prevents invisible text (FOIT); a brief FOUT with system fonts is acceptable.
      - <noscript> ensures fonts still load when JS is disabled.
    -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
